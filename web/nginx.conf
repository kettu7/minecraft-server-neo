server {
  listen 80;
  server_name _;
  # Weiterleitungen relativ halten (nginx läuft intern auf Port 80, außen auf 4200)
  absolute_redirect off;
  root /usr/share/nginx/html;

  # Uploads von Schematics
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API (inkl. Discord-Login-Rücksprung) an den API-Container
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Backups erstellen und herunterladen kann etwas dauern
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # Karte (BlueMap) unter derselben Adresse wie die Website – nur für angemeldete Mitglieder,
  # denn sie zeigt Spielerpositionen. Gleiche Adresse erlaubt der Website, eigene Marker einzublenden.
  location = /_auth {
    internal;
    proxy_pass http://api:3000/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }
  location ^~ /map/ {
    auth_request /_auth;
    error_page 401 403 = @login;
    proxy_pass http://mc:8100/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }
  location @login {
    return 302 /login;
  }

  # Item-Bibliothek (lokal erzeugt, als Ordner eingebunden)
  location ^~ /items/ {
    expires 7d;
    try_files $uri =404;
  }

  # Die Seite /items gehört der App – nicht als Ordner behandeln (sonst Umleitung auf /items/ → 404)
  location = /items {
    try_files /index.html =404;
  }

  # Angular-Dateien mit Hash im Namen lange cachen
  location ~* \.(js|css|woff2?)$ {
    expires 30d;
    try_files $uri =404;
  }

  # Alle anderen Pfade gehören der Angular-App
  location / {
    try_files $uri $uri/ /index.html;
  }
}
